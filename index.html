<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>يوم الحاسب - مصممات المستقبل</title>
  <style>
    /* Global Styles */
    body {
      animation: bgShift 6s ease-in-out infinite alternate;
      margin: 0;
      font-family: "Tahoma", sans-serif;
      background: linear-gradient(135deg, #7b42f6, #4acfff);
      color: white;
    }

    header {
      text-align: center;
      padding: 50px 20px;
    }

    header h1 {
      font-size: 45px;
      margin-bottom: 10px;
    }

    header h2 {
      font-size: 24px;
      opacity: 0.9;
    }

    .section {
      background: rgba(255, 255, 255, 0.15);
      margin: 30px auto;
      padding: 25px;
      width: 85%;
      border-radius: 20px;
      backdrop-filter: blur(8px);
      text-align: center;
    }

    .section h3 {
      margin-top: 0;
      font-size: 26px;
      border-bottom: 2px solid rgba(255, 255, 255, 0.5);
      padding-bottom: 10px;
      margin-bottom: 20px;
    }

    /* Gallery Styles */
    .gallery {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
      position: relative;
      overflow: hidden;
    }

    .gallery img {
      width: 100%;
      border-radius: 15px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.25);
      transition: transform 0.3s, filter 0.3s;
      cursor: pointer;
    }

    .gallery img:hover {
      transform: scale(1.06);
      filter: brightness(1.2);
      box-shadow: 0 6px 14px rgba(0,0,0,0.35);
    }

    .glitter::after {
      content: "";
      position: absolute;
      top: 0;
      left: -100%;
      width: 200%;
      height: 100%;
      background: linear-gradient(
        120deg,
        transparent 0%,
        rgba(255,255,255,0.6) 50%,
        transparent 100%
      );
      animation: shine 3s infinite;
    }

    @keyframes shine {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    @keyframes bgShift {
      0% { background: linear-gradient(135deg, #7b42f6, #4acfff); }
      100% { background: linear-gradient(135deg, #4acfff, #7b42f6); }
    }

    footer {
      text-align: center;
      padding: 20px;
      opacity: 0.8;
      margin-top: 40px;
    }

    /* Fun Fact Button */
    .fun-button {
      padding: 12px 25px;
      font-size: 18px;
      border-radius: 10px;
      border: none;
      background: rgba(255,255,255,0.33);
      color: white;
      cursor: pointer;
      backdrop-filter: blur(6px);
    }
    .video-section {
  width: 85%;
  margin: 40px auto;
  background: rgba(255, 255, 255, 0.12);
  padding: 25px;
  border-radius: 20px;
  backdrop-filter: blur(8px);
  color: white;
}

.video-section h3 {
  font-size: 28px;
  margin-bottom: 20px;
  border-bottom: 2px solid rgba(255,255,255,0.5);
  padding-bottom: 10px;
}

.video-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
  gap: 20px;
}

.video-card {
  background: linear-gradient(135deg, #7b42f6aa, #4acfffaa);
  padding: 15px;
  border-radius: 18px;
  box-shadow: 0 5px 12px rgba(0,0,0,0.3);
  transition: 0.3s;
  overflow: hidden;
  position: relative;
}

.video-card video {
  width: 100%;
  border-radius: 12px;
}

.video-card:hover {
  transform: scale(1.04);
  box-shadow: 0 8px 20px rgba(0,0,0,0.4);
}
  </style>
</head>
<body>

  <header>
    <h1 id="title">يوم الحاسب</h1>
    <h2>فريق: مصممات المستقبل</h2>
  </header>

  <!-- Typing Animation -->
  <script>
    const text = "يوم الحاسب";
    let i = 0;
    function typeEffect() {
      if (i < text.length) {
        document.getElementById("title").innerHTML = text.substring(0, i+1);
        i++;
        setTimeout(typeEffect, 150);
      }
    }
    window.onload = typeEffect;
  </script>

  <!-- About Section -->
  <div class="section">
    <h3>عن المشروع</h3>
    <p>
      هذا المشروع يقدّم أعمال وتصاميم فريقنا لمناسبة يوم الحاسب بطريقة مرتّبة وجميلة.
    </p>
  </div>

  <!-- Gallery Section -->
  <div class="section glitter">
    <h3>معرض الصور</h3>
    <div class="gallery">
      <img src="photo1.jpg" alt="الصورة 1">
      <img src="photo2.jpg" alt="الصورة 2">
      <img src="photo3.jpg" alt="الصورة 3">
      <img src="photo4.jpg" alt="الصورة 4">
      <img src="photo5.jpg" alt="الصورة 5">
    </div>
  </div>
<div class="video-section">
  <h3>معرض الفيديوهات</h3>

  <div class="video-grid">
    <div class="video-card">
      <video src="video1.mp4" controls></video>
    </div>

    <div class="video-card">
      <video src="video2.mp4" controls></video>
    </div>

    <div class="video-card">
      <video src="video3.mp4" controls></video>
    </div>
  </div>
</div>

  <!-- Fun Fact Button -->
  <div style="margin: 40px; text-align:center;">
    <button class="fun-button" onclick="showFunFact()">اضغطي لمعرفة معلومة ممتعة!</button>
  </div>

  <script>
    function showFunFact() {
      alert("💻 هل تعلم؟ أول جهاز كمبيوتر في العالم كان بحجم غرفة كبيرة، بينما اليوم يمكن وضع جهاز كمبيوتر صغير في راحة يدك!");
    }
  </script>

  <!-- Footer -->
  <footer>
    <p>© 2025 مصممات المستقبل — تصميم: لين علي — المعلمة: منيرة العنيزي</p>
  </footer>

</body>
</html>
